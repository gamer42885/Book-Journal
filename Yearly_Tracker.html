<body>

<div class="topnav">
  <a href="index.html">Home</a>
  <a href="Book_Series.html">Book Series</a>

<div class="container">
    <div class="hero">
        <h1>📚 Yearly Book Summary</h1>
        <p>See your year at a glance in the same dashboard style as the rest of your tracker.</p>
    </div>

    <div class="section">
        <div class="format-card">
            <div class="format-header">📄 Export</div>

                <button id="exportYearPdfBtn" style="background:#8e44ad;">📄 Export Year as PDF</button>

        <div id="yearSummary" class="summary-box"></div>

    <div class="section">

            <div class="format-header">📅 Monthly Breakdown</div>
            <div id="dashboard" class="dashboard-grid"></div>
        </div>
    </div>
</div>

<script>
function formatLength(totalMinutes) {
    totalMinutes = Number(totalMinutes || 0);
    const hours = Math.floor(totalMinutes / 60);
    const minutes = totalMinutes % 60;
    return `${hours}h ${minutes}m`;
}

function parseLengthToMinutes(value) {
    if (value === null || value === undefined || value === "") return 0;

    if (typeof value === "number") return value;

    const str = String(value).trim().toLowerCase();

    if (/^\d+(\.\d+)?$/.test(str)) {
        return Number(str);
    }

    if (/^\d{1,2}:\d{1,2}$/.test(str)) {
        const [h, m] = str.split(":").map(Number);
        return (h * 60) + m;
    }

    const hourMatch = str.match(/(\d+)\s*(h|hr|hrs|hour|hours)/);
    const minuteMatch = str.match(/(\d+)\s*(m|min|mins|minute|minutes)/);

    const hours = hourMatch ? Number(hourMatch[1]) : 0;
    const minutes = minuteMatch ? Number(minuteMatch[1]) : 0;

    if (hours || minutes) {
        return (hours * 60) + minutes;
    }

    return 0;
}

function getBookLengthMinutes(book) {
    return parseLengthToMinutes(book.audioLength ?? book.length ?? 0);
}

function isPhysicalBook(book) {
    const format = (book.format || "").trim().toLowerCase();
    return format !== "audio" && format !== "ebook";
}

// -------------------- Render Dashboard --------------------
function renderDashboard() {
    const months = JSON.parse(localStorage.getItem("months")) || [];
    const books = JSON.parse(localStorage.getItem("books")) || [];
    const container = document.getElementById("dashboard");

    container.innerHTML = "";

    const totalBooks = books.filter(isPhysicalBook).length;
    const totalPages = books.reduce((sum, b) => sum + Number(b.pages || 0), 0);
    const avgRating = books.length
        ? (books.reduce((sum, b) => sum + Number(b.rating || 0), 0) / books.length).toFixed(2)
        : 0;

    const totalAudio = books.filter(b => (b.format || "").trim().toLowerCase() === "audio").length;
    const totalEbooks = books.filter(b => (b.format || "").trim().toLowerCase() === "ebook").length;

    const totalLength = books
        .filter(b => (b.format || "").trim().toLowerCase() === "audio")
        .reduce((sum, b) => sum + getBookLengthMinutes(b), 0);

    const genreCount = {};
    books.forEach(b => {
        if (!b.tags) return;
        b.tags.split(",").forEach(tag => {
            tag = tag.trim();
            if (tag) genreCount[tag] = (genreCount[tag] || 0) + 1;
        });
    });

    const topGenres = Object.entries(genreCount)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5)
        .map(([g, c]) => `${g} (${c})`)
        .join(", ");

    document.getElementById("yearSummary").innerHTML = `
        <h3>Yearly Summary</h3>
        <p>Total Books Read: ${totalBooks}</p>
        <p>Total Audio: ${totalAudio}</p>
        <p>Total Ebooks: ${totalEbooks}</p>
        <p>Total Pages Read: ${totalPages}</p>
        <p>Total Length: ${formatLength(totalLength)}</p>
        <p>Average Rating: ${avgRating}</p>
        <p>Top Genres: ${topGenres || "N/A"}</p>
    `;

    months.forEach(m => {
        const monthBooks = books.filter(b => b.month === m.value);
        const totalBooksMonth = monthBooks.filter(isPhysicalBook).length;
        const totalPagesMonth = monthBooks.reduce((sum, b) => sum + Number(b.pages || 0), 0);
        const totalAudioMonth = monthBooks.filter(b => (b.format || "").trim().toLowerCase() === "audio").length;
        const totalEbooksMonth = monthBooks.filter(b => (b.format || "").trim().toLowerCase() === "ebook").length;
        const totalLengthMonth = monthBooks
            .filter(b => (b.format || "").trim().toLowerCase() === "audio")
            .reduce((sum, b) => sum + getBookLengthMinutes(b), 0);

        const div = document.createElement("div");
        div.className = "summary-box";
        div.innerHTML = `
            <h3>${m.label}</h3>
            <p>Books: ${totalBooksMonth}</p>
            <p>Audio: ${totalAudioMonth}</p>
            <p>Ebooks: ${totalEbooksMonth}</p>
            <p>Pages: ${totalPagesMonth}</p>
            <p>Length: ${formatLength(totalLengthMonth)}</p>
        `;
        container.appendChild(div);
    });
}

renderDashboard();

// -------------------- Export Yearly PDF --------------------
document.getElementById("exportYearPdfBtn").addEventListener("click", () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    const months = JSON.parse(localStorage.getItem("months")) || [];
    const books = JSON.parse(localStorage.getItem("books")) || [];

    let y = 10;

    doc.setFontSize(18);
    doc.text("Yearly Reading Report", 10, y);
    y += 10;

    const totalBooks = books.filter(isPhysicalBook).length;
    const totalPages = books.reduce((sum, b) => sum + Number(b.pages || 0), 0);
    const avgRating = books.length
        ? (books.reduce((sum, b) => sum + Number(b.rating || 0), 0) / books.length).toFixed(2)
        : 0;
    const totalAudio = books.filter(b => (b.format || "").trim().toLowerCase() === "audio").length;
    const totalEbooks = books.filter(b => (b.format || "").trim().toLowerCase() === "ebook").length;
    const totalLength = books
        .filter(b => (b.format || "").trim().toLowerCase() === "audio")
        .reduce((sum, b) => sum + getBookLengthMinutes(b), 0);

    doc.setFontSize(12);
    doc.text(`Total Books: ${totalBooks}`, 10, y); y += 6;
    doc.text(`Total Audio: ${totalAudio}`, 10, y); y += 6;
    doc.text(`Total Ebooks: ${totalEbooks}`, 10, y); y += 6;
    doc.text(`Total Pages: ${totalPages}`, 10, y); y += 6;
    doc.text(`Total Length: ${formatLength(totalLength)}`, 10, y); y += 6;
    doc.text(`Average Rating: ${avgRating}`, 10, y); y += 10;

    months.forEach(m => {
        if (y > 270) {
            doc.addPage();
            y = 10;
        }

        const monthBooks = books.filter(b => b.month === m.value);
        const totalBooksMonth = monthBooks.filter(isPhysicalBook).length;
        const totalPagesMonth = monthBooks.reduce((sum, b) => sum + Number(b.pages || 0), 0);
        const totalAudioMonth = monthBooks.filter(b => (b.format || "").trim().toLowerCase() === "audio").length;
        const totalEbooksMonth = monthBooks.filter(b => (b.format || "").trim().toLowerCase() === "ebook").length;
        const totalLengthMonth = monthBooks
            .filter(b => (b.format || "").trim().toLowerCase() === "audio")
            .reduce((sum, b) => sum + getBookLengthMinutes(b), 0);

        doc.setFontSize(14);
        doc.text(m.label, 10, y); y += 6;
        doc.setFontSize(11);
        doc.text(`Books: ${totalBooksMonth}`, 10, y); y += 5;
        doc.text(`Audio: ${totalAudioMonth}`, 10, y); y += 5;
        doc.text(`Ebooks: ${totalEbooksMonth}`, 10, y); y += 5;
        doc.text(`Pages: ${totalPagesMonth}`, 10, y); y += 5;
        doc.text(`Length: ${formatLength(totalLengthMonth)}`, 10, y); y += 8;
    });

    doc.save("Yearly_Reading_Report.pdf");
});
</script>
